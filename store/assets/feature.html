<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<style>
  html,body{margin:0;padding:0}
  .g{width:1024px;height:500px;background:#0B6E4F;position:relative;overflow:hidden;
     font-family:'Roboto',system-ui,sans-serif;color:#fff;display:flex;align-items:center}
  .copy{padding:0 0 0 72px;max-width:560px;position:relative;z-index:2}
  .name{font-size:76px;font-weight:700;letter-spacing:-1px;line-height:1}
  .tag{font-size:28px;font-weight:400;line-height:1.3;margin-top:18px;opacity:.92}
  /* The dose shapes from the app: cookie = owed, clover = taken. */
  .art{position:absolute;right:-40px;top:0;bottom:0;width:520px;display:flex;
       align-items:center;justify-content:center}
  .pill{position:absolute;width:112px;height:112px;background:#fff;border-radius:56px 56px 56px 56px;
        display:flex;align-items:center;justify-content:center}
</style></head><body>
<div class="g">
  <div class="copy">
    <div class="name">Dose</div>
    <div class="tag">Your medications, on time.<br>Everything stays on your phone.</div>
  </div>
  <div class="art">
    <svg width="470" height="470" viewBox="0 0 100 100">
      <!-- clover (taken) -->
      <g transform="translate(52 18) scale(0.42)">
        <circle cx="50" cy="50" r="46" fill="#ffffff" opacity=".16"/>
      </g>
      <!-- big cookie holding a capsule, the app's "dose due now" mark -->
      <g transform="translate(50 52)">
        <path id="c" d="M0,-40 C6,-40 10,-33 16,-32 C22,-31 28,-36 32,-32 C36,-28 32,-21 34,-16 C36,-10 44,-8 44,-1 C44,6 36,8 34,14 C32,20 36,27 32,31 C28,35 22,30 16,31 C10,32 6,39 0,39 C-6,39 -10,32 -16,31 C-22,30 -28,35 -32,31 C-36,27 -32,20 -34,14 C-36,8 -44,6 -44,-1 C-44,-8 -36,-10 -34,-16 C-32,-21 -36,-28 -32,-32 C-28,-36 -22,-31 -16,-32 C-10,-33 -6,-40 0,-40 Z"
              fill="#ffffff"/>
        <g transform="rotate(-40)">
          <rect x="-19" y="-8" width="38" height="16" rx="8" fill="#0B6E4F"/>
          <rect x="-1.4" y="-8" width="2.8" height="16" fill="#ffffff"/>
        </g>
      </g>
    </svg>
  </div>
</div>
</body></html>
