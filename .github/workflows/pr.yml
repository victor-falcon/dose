name: PR

on:
  pull_request:
    # `edited` matters: without it a fixed title never re-runs the check.
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # Gates merges on a Conventional-Commit PR title. The title is what
      # GitHub puts in the generated release notes, so this is what keeps the
      # changelog readable. Make this check required in branch protection,
      # otherwise it reports but doesn't block.
      - name: Conventional PR title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            style
            refactor
            perf
            test
            build
            ci
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            Subject must not start with uppercase. Use: feat: add checkout, fix(billing): handle retry.
