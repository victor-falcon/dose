name: Release APK

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # No wrapper jar is committed, so CI provisions Gradle itself.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.DOSE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          test -s "$RUNNER_TEMP/upload.jks" || { echo "::error::DOSE_KEYSTORE_BASE64 secret is missing or empty"; exit 1; }

      - name: Build release APK
        env:
          DOSE_STORE_FILE: ${{ runner.temp }}/upload.jks
          DOSE_STORE_PASSWORD: ${{ secrets.DOSE_STORE_PASSWORD }}
          DOSE_KEY_ALIAS: ${{ secrets.DOSE_KEY_ALIAS }}
          DOSE_KEY_PASSWORD: ${{ secrets.DOSE_KEY_PASSWORD }}
        run: gradle :app:assembleRelease -PappVersion="${GITHUB_REF_NAME#v}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fixed asset name: /releases/latest/download/dose.apk is a permalink only if
          # the file name never changes. The tag carries the version for Obtainium.
          mv app/build/outputs/apk/release/app-release.apk dose.apk
          sha=$(sha256sum dose.apk | cut -d' ' -f1)
          notes=$(printf '%s\n' "Built from $GITHUB_SHA" "" 'SHA-256 (`dose.apk`):' '```' "$sha" '```')
          # --generate-notes appends the changelog since the previous tag.
          gh release create "$GITHUB_REF_NAME" dose.apk --title "$GITHUB_REF_NAME" \
            --notes "$notes" --generate-notes --verify-tag
