name: Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # No wrapper jar is committed, so CI provisions Gradle itself.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.DOSE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          test -s "$RUNNER_TEMP/upload.jks" || { echo "::error::DOSE_KEYSTORE_BASE64 secret is missing or empty"; exit 1; }

      - name: Build release APK
        env:
          DOSE_STORE_FILE: ${{ runner.temp }}/upload.jks
          DOSE_STORE_PASSWORD: ${{ secrets.DOSE_STORE_PASSWORD }}
          DOSE_KEY_ALIAS: ${{ secrets.DOSE_KEY_ALIAS }}
          DOSE_KEY_PASSWORD: ${{ secrets.DOSE_KEY_PASSWORD }}
        run: gradle :app:assembleRelease

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          tag="v$version-${{ github.run_number }}"
          mv app/build/outputs/apk/release/app-release.apk "dose-$tag.apk"
          gh release create "$tag" "dose-$tag.apk" \
            --title "$tag" \
            --notes "Built from ${{ github.sha }}"
