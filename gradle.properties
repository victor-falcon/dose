org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true

android.useAndroidX=true
android.nonTransitiveRClass=true
# ponytail: KSP still registers generated sources via kotlin.sourceSets, which
# AGP 9 built-in Kotlin rejects. Sanctioned bridge; drop once KSP adopts the
# android.sourceSets API. https://developer.android.com/r/tools/built-in-kotlin
android.disallowKotlinSourceSets=false

kotlin.code.style=official
